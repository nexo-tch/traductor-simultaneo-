# Despliegue en Render (render.com → New → Blueprint → este repositorio).
# GEMINI_API_KEY y CODIGO_ACCESO se escriben en el panel de Render, nunca aquí.
services:
  - type: web
    name: traductor-simultaneo
    runtime: node
    region: virginia
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: CODIGO_ACCESO
        sync: false
